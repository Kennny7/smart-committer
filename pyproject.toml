[project]
name = "smart-committer"
version = "0.2.0"
description = "Local LLM Git commit automation microservice and CLI powered by Ollama."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Smart Committer Contributors", email = "info@smart-committer.dev" }]
keywords = ["git", "commit", "ollama", "llm", "automation", "conventional-commits", "microservice", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Software Development :: Version Control :: Git",
]

dependencies = [
    "ollama>=0.4.0",
    "rich>=13.7.0",
    "questionary>=2.0.1",
    "python-dotenv>=1.0.1",
    "pathspec>=0.12.1",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[project.scripts]
smart-committer = "smart_committer.main:app"

[project.urls]
Homepage = "https://github.com/Kennny7/smart-committer"
Documentation = "https://github.com/Kennny7/smart-committer#readme"
Issues = "https://github.com/Kennny7/smart-committer/issues"
Repository = "https://github.com/Kennny7/smart-committer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_committer"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.3.0",
    "pyinstaller>=6.0.0",
]
